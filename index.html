<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الألواح الشمسية</title>
    
    <!-- إعدادات PWA والأيقونات -->
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #e2e8f0; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            padding: 16px 12px; 
            transition: all 0.3s ease;
        }
        .container { 
            background-color: #1e293b; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4); 
            border: 1px solid #334155;
            overflow: visible;
            position: relative;
        }
        
        /* زر تبديل اللغة */
        .lang-toggle { 
            position: absolute; 
            top: 12px; 
            left: 12px; 
            background: rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            color: white; 
            padding: 5px 10px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            backdrop-filter: blur(4px); 
            transition: 0.2s; 
            z-index: 10; 
        }
        html[dir="ltr"] .lang-toggle { left: auto; right: 12px; }
        .lang-toggle:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.05); }

        /* ترويسة الألواح الشمسية */
        .header { 
            background: linear-gradient(135deg, #1e3a8a, #0369a1); 
            color: white; 
            text-align: center; 
            padding: 40px 16px 28px; 
            border-top-left-radius: 20px; 
            border-top-right-radius: 20px; 
            margin-bottom: 20px;
        }
        .title-box { 
            display: inline-flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: rgba(0, 0, 0, 0.2); 
            padding: 16px 24px; 
            border-radius: 20px; 
            border: 2px solid rgba(255, 255, 255, 0.3); 
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(5px); 
        }
        .title-box h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.4); color: #ffffff; }

        .content { padding: 0 20px 20px; }

        .input-group { flex: 1; display: flex; flex-direction: column; min-width: 0; transition: all 0.3s ease; }
        label { display: block; margin-bottom: 6px; font-size: 12px; color: #94a3b8; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .flex-row { display: flex; gap: 12px; align-items: flex-end; width: 100%; margin-bottom: 14px; }
        
        input { 
            width: 100%;
            height: 42px; 
            background-color: #0f172a; 
            border: 1px solid #475569; 
            color: white; 
            padding: 0 12px; 
            border-radius: 10px; 
            font-size: 15px; 
            text-align: center; 
            outline: none; 
            transition: all 0.2s ease; 
            direction: ltr;
        }
        input:hover { border-color: #38bdf8; background-color: #1e293b; box-shadow: 0 0 8px rgba(56, 189, 248, 0.2); }
        input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.3); background-color: #0f172a; }

        /* تنسيقات القوائم المنسدلة الاحترافية وتوسيط النص */
        .custom-select-wrapper { position: relative; width: 100%; user-select: none; z-index: 1; }
        .custom-select-display { 
            height: 42px; 
            background-color: #0f172a; 
            border: 1px solid #475569; 
            color: white; 
            padding: 0 12px; 
            border-radius: 10px; 
            font-size: 13px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: 600; 
            transition: all 0.2s ease; 
        }
        .custom-select-display:hover { border-color: #38bdf8; background-color: #1e293b; box-shadow: 0 0 8px rgba(56, 189, 248, 0.2); }
        .custom-select-display:active { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.3); }
        
        /* كلاسات التوسيط المثالي للنص داخل القائمة */
        .select-spacer { width: 16px; } 
        .select-text { flex: 1; text-align: center; }
        .select-arrow { width: 16px; text-align: center; font-size: 10px; color: #94a3b8; }

        .custom-select-options { 
            display: none; 
            position: absolute; 
            top: calc(100% + 4px); 
            left: 0; right: 0; 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 10px; 
            z-index: 999; 
            overflow: hidden; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
        .custom-select-options.show { display: block; animation: fadeIn 0.2s; }
        .custom-option { padding: 12px 10px; color: #e2e8f0; font-size: 12.5px; text-align: center; cursor: pointer; border-bottom: 1px solid #334155; transition: 0.2s; }
        .custom-option:last-child { border-bottom: none; }
        .custom-option:hover { background-color: #0f172a; color: #38bdf8; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }

        .result-box { 
            background: rgba(3, 105, 161, 0.1); 
            border: 1px solid rgba(3, 105, 161, 0.3); 
            padding: 24px 16px; 
            border-radius: 16px; 
            text-align: center; 
            margin-top: 24px; 
        }
        .result-label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
        .result-number { font-size: 46px; font-weight: bold; color: #38bdf8; line-height: 1; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(56, 189, 248, 0.3); }
        .result-details { font-size: 12.5px; color: #64748b; font-weight: 500; }

        .btn-reset { 
            width: 100%; 
            background-color: #dc2626; 
            color: white; 
            margin-top: 24px; 
            font-size: 14px; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            border: none; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
            transition: background 0.2s, transform 0.1s; 
        }
        .btn-reset:active { transform: scale(0.98); }

        .solar-footer { background-color: #0f172a; text-align: center; padding: 20px 16px; margin-top: 24px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; border-top: 1px solid #334155; }
        .copyright-text { font-size: 13.5px; margin: 0 0 8px 0; color: #e2e8f0; }
        .author-name { color: #38bdf8; font-weight: 700; }
        .social-links { display: flex; justify-content: center; gap: 16px; margin-top: 14px; }
        .social-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; color: white; text-decoration: none; transition: transform 0.2s; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .social-btn:hover { transform: scale(1.1); }
        .whatsapp { background-color: #25D366; }
        .facebook { background-color: #1877F2; }
        .social-btn svg { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="container">
        <button class="lang-toggle" onclick="toggleLanguage()" id="langBtn">🌐 EN</button>
        
        <div class="header">
            <div class="title-box">
                <h1 data-i18n="appTitle">حاسبة الألواح الشمسية ⚡</h1>
            </div>
        </div>

        <div class="content">
            <!-- الصف الأول: وحدة القياس + جهد المنظومة -->
            <div class="flex-row">
                <div class="input-group" id="unitGroup">
                    <label data-i18n="unitLabel">وحدة القياس:</label>
                    <div class="custom-select-wrapper">
                        <div class="custom-select-display" onclick="toggleDropdown('unitDropdown')">
                            <span class="select-spacer"></span>
                            <span id="unitDisplay" class="select-text" data-i18n="wh">واط (Wh)</span>
                            <span class="select-arrow">▼</span>
                        </div>
                        <div class="custom-select-options" id="unitDropdown">
                            <div class="custom-option" onclick="selectUnit('kwh')" data-i18n="kwh">كيلوواط (kWh)</div>
                            <div class="custom-option" onclick="selectUnit('wh')" data-i18n="wh">واط (Wh)</div>
                            <div class="custom-option" onclick="selectUnit('ah')" data-i18n="ah">أمبير (Ah)</div>
                        </div>
                        <input type="hidden" id="unitValue" value="wh">
                    </div>
                </div>
                
                <div class="input-group hidden" id="voltageGroup">
                    <label data-i18n="sysVoltage">جهد المنظومة (V):</label>
                    <div class="custom-select-wrapper">
                        <div class="custom-select-display" onclick="toggleDropdown('voltDropdown')">
                            <span class="select-spacer"></span>
                            <span id="voltDisplay" class="select-text" data-i18n="v48">48 فولت</span>
                            <span class="select-arrow">▼</span>
                        </div>
                        <div class="custom-select-options" id="voltDropdown">
                            <div class="custom-option" onclick="selectVoltage('12')" data-i18n="v12">12 فولت</div>
                            <div class="custom-option" onclick="selectVoltage('24')" data-i18n="v24">24 فولت</div>
                            <div class="custom-option" onclick="selectVoltage('48')" data-i18n="v48">48 فولت</div>
                        </div>
                        <input type="hidden" id="voltageValue" value="48">
                    </div>
                </div>
            </div>

            <!-- الصف الثاني: سعة البطارية الواحدة | عدد البطاريات -->
            <div class="flex-row">
                <div class="input-group">
                    <label data-i18n="batteryCapacity">سعة البطارية الواحدة:</label>
                    <input type="number" id="capacityInput" value="0" min="0" step="any">
                </div>
                <div class="input-group">
                    <label data-i18n="batteryCount">عدد البطاريات:</label>
                    <input type="number" id="batteryCountInput" value="0" min="0" step="1">
                </div>
            </div>

            <!-- الصف الثالث: قدرة اللوح الواحد | ساعات ذروة الشمس -->
            <div class="flex-row">
                <div class="input-group">
                    <label data-i18n="panelPower">قدرة اللوح الواحد (W):</label>
                    <input type="number" id="panelInput" value="0" min="0">
                </div>
                <div class="input-group">
                    <label data-i18n="sunHours">ساعات ذروة الشمس:</label>
                    <input type="number" id="sunHoursInput" value="0" min="0" step="0.5">
                </div>
            </div>

            <!-- الصف الرابع: المنطقة الجغرافية (نسبة الكفاءة) -->
            <div class="flex-row">
                <div class="input-group" id="efficiencyGroup">
                    <label data-i18n="regionEfficiency">منطقة الاستخدام (نسبة الكفاءة):</label>
                    <div class="custom-select-wrapper">
                        <div class="custom-select-display" onclick="toggleDropdown('efficiencyDropdown')">
                            <span class="select-spacer"></span>
                            <span id="efficiencyDisplay" class="select-text" data-i18n="regionSanaa">مناطق معتدلة (85%)</span>
                            <span class="select-arrow">▼</span>
                        </div>
                        <div class="custom-select-options" id="efficiencyDropdown">
                            <div class="custom-option" onclick="selectEfficiency('0.85', 'regionSanaa')" data-i18n="regionSanaa">مناطق معتدلة (85%)</div>
                            <div class="custom-option" onclick="selectEfficiency('0.75', 'regionAden')" data-i18n="regionAden">مناطق حارة (75%)</div>
                        </div>
                        <input type="hidden" id="efficiencyValue" value="0.85">
                        <input type="hidden" id="efficiencyKey" value="regionSanaa">
                    </div>
                </div>
            </div>

            <div class="result-box">
                <div class="result-label" data-i18n="resultLabel">عدد الألواح المطلوبة للشحن</div>
                <div class="result-number">
                    <span id="panelsOutput">0</span> 
                    <span style="font-size: 16px;" data-i18n="panelsWord">ألواح</span>
                </div>
                <div class="result-details" id="detailsOutput">إجمالي القدرة المطلوبة: 0 واط</div>
            </div>

            <button class="btn-reset" onclick="resetData()">
                <span data-i18n="resetBtn">⚠️ تصفير البيانات</span>
            </button>
        </div>

        <footer class="solar-footer">
            <p class="copyright-text"><span data-i18n="devBy">تصميم وتطوير</span> <span class="author-name">مازن العوذلي</span> &copy; 2026</p>
            <div class="social-links">
                <a href="https://wa.me/message/BSOAV5RVXBNQP1" target="_blank" class="social-btn whatsapp"><svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.966C16.528 1.975 14.067 1.053 12 1.053c-5.438 0-9.864 4.373-9.868 9.803-.001 1.714.453 3.39 1.317 4.873L2.43 21.48l5.857-1.534zM16.71 14.65c-.259-.13-1.534-.759-1.773-.846-.239-.087-.413-.13-.587.13-.174.26-.674.846-.826 1.018-.152.173-.304.195-.563.065-.259-.13-1.096-.404-2.088-1.292-.771-.69-1.292-1.542-1.444-1.802-.152-.26-.016-.4.114-.53.117-.117.259-.304.39-.455.13-.152.174-.26.26-.433.087-.173.043-.325-.022-.455-.065-.13-.587-1.413-.804-1.944-.213-.518-.447-.448-.607-.456-.157-.008-.337-.01-.517-.01-.18 0-.474.067-.72.337-.247.271-.943.924-.943 2.255s.967 2.61 1.101 2.784c.134.173 1.902 2.904 4.609 4.07.644.277 1.148.443 1.541.568.647.206 1.236.177 1.701.108.519-.077 1.534-.627 1.751-1.234.217-.607.217-1.127.152-1.234-.064-.108-.239-.173-.499-.303z"/></svg></a>
                <a href="https://www.facebook.com/share/1YF9n8KTFK/" target="_blank" class="social-btn facebook"><svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a>
            </div>
        </footer>
    </div>

    <!-- كود الجافاسكربت الخاص بحسابات التطبيق -->
    <script>
        const dict = {
            ar: {
                appTitle: "حاسبة الألواح الشمسية ⚡", 
                batteryCapacity: "سعة البطارية الواحدة:", batteryCount: "عدد البطاريات:",
                unitLabel: "وحدة القياس:", kwh: "كيلوواط (kWh)", wh: "واط (Wh)", ah: "أمبير (Ah)", 
                sysVoltage: "جهد المنظومة (V):", v12: "12 فولت", v24: "24 فولت", v48: "48 فولت", 
                panelPower: "قدرة اللوح الواحد (W):", sunHours: "ساعات ذروة الشمس:", 
                regionEfficiency: "منطقة الاستخدام (نسبة الكفاءة):", regionSanaa: "مناطق معتدلة (85%)", regionAden: "مناطق حارة (75%)",
                resultLabel: "عدد الألواح المطلوبة للشحن", panelsWord: "ألواح", 
                totalPowerPre: "إجمالي القدرة المطلوبة:", wattWord: "واط",
                resetBtn: "⚠️ تصفير البيانات", devBy: "تصميم وتطوير"
            },
            en: {
                appTitle: "Solar Panels Calculator ⚡", 
                batteryCapacity: "Single Battery Capacity:", batteryCount: "Number of Batteries:",
                unitLabel: "Measurement Unit:", kwh: "Kilowatts (kWh)", wh: "Watts (Wh)", ah: "Amperes (Ah)", 
                sysVoltage: "System Voltage (V):", v12: "12 Volts", v24: "24 Volts", v48: "48 Volts", 
                panelPower: "Single Panel Power (W):", sunHours: "Peak Sun Hours:", 
                regionEfficiency: "Geographic Region (Efficiency):", regionSanaa: "Mild Regions (85%)", regionAden: "Hot Regions (75%)",
                resultLabel: "Required Panels for Charging", panelsWord: "Panels", 
                totalPowerPre: "Total Required Power:", wattWord: "Watts",
                resetBtn: "⚠️ Reset Data", devBy: "Designed & Developed by"
            }
        };

        let currentLang = localStorage.getItem('solar_panel_lang') || 'ar';

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('solar_panel_lang', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            const t = dict[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = currentLang === 'ar' ? '🌐 EN' : '🌐 AR';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(t[key]) el.innerHTML = t[key];
            });

            const unitVal = document.getElementById('unitValue').value;
            const voltVal = document.getElementById('voltageValue').value;
            const effKey = document.getElementById('efficiencyKey').value;
            
            document.getElementById('unitDisplay').innerText = t[unitVal];
            document.getElementById('voltDisplay').innerText = t["v" + voltVal];
            document.getElementById('efficiencyDisplay').innerText = t[effKey];
            
            calculate();
        }

        function toggleDropdown(id) {
            document.querySelectorAll('.custom-select-options').forEach(el => {
                if(el.id !== id) el.classList.remove('show');
            });
            const dropdown = document.getElementById(id);
            dropdown.classList.toggle('show');
            if (dropdown.classList.contains('show')) {
                dropdown.closest('.custom-select-wrapper').style.zIndex = '999';
            } else {
                dropdown.closest('.custom-select-wrapper').style.zIndex = '1';
            }
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.custom-select-wrapper')) {
                document.querySelectorAll('.custom-select-options').forEach(el => el.classList.remove('show'));
                document.querySelectorAll('.custom-select-wrapper').forEach(el => el.style.zIndex = '1');
            }
        });

        function selectUnit(val) {
            const t = dict[currentLang];
            document.getElementById('unitValue').value = val;
            document.getElementById('unitDisplay').innerText = t[val];
            document.getElementById('unitDropdown').classList.remove('show');
            document.getElementById('unitDropdown').closest('.custom-select-wrapper').style.zIndex = '1';
            
            const voltGroup = document.getElementById('voltageGroup');
            
            if (val === 'ah') {
                voltGroup.classList.remove('hidden');
            } else {
                voltGroup.classList.add('hidden');
            }
            calculate();
        }

        function selectVoltage(val) {
            const t = dict[currentLang];
            document.getElementById('voltageValue').value = val;
            document.getElementById('voltDisplay').innerText = t["v" + val];
            document.getElementById('voltDropdown').classList.remove('show');
            document.getElementById('voltDropdown').closest('.custom-select-wrapper').style.zIndex = '1';
            calculate();
        }

        function selectEfficiency(val, key) {
            const t = dict[currentLang];
            document.getElementById('efficiencyValue').value = val;
            document.getElementById('efficiencyKey').value = key;
            document.getElementById('efficiencyDisplay').innerText = t[key];
            document.getElementById('efficiencyDropdown').classList.remove('show');
            document.getElementById('efficiencyDropdown').closest('.custom-select-wrapper').style.zIndex = '1';
            calculate();
        }

        document.addEventListener('focusin', function(e) {
            if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'number') {
                e.target.select();
            }
        });

        function calculate() {
            const t = dict[currentLang];
            let singleCapacity = parseFloat(document.getElementById('capacityInput').value) || 0;
            let battCount = parseFloat(document.getElementById('batteryCountInput').value) || 0;
            let panelWatts = parseFloat(document.getElementById('panelInput').value) || 0;
            let sunHours = parseFloat(document.getElementById('sunHoursInput').value) || 0;
            let unit = document.getElementById('unitValue').value;
            let voltage = parseFloat(document.getElementById('voltageValue').value) || 48;
            let systemEfficiency = parseFloat(document.getElementById('efficiencyValue').value) || 0.85;

            let totalEnergyWh = (unit === 'kwh') ? (singleCapacity * 1000 * battCount) : 
                                (unit === 'wh') ? (singleCapacity * battCount) : 
                                (singleCapacity * voltage * battCount);
            let neededWh = totalEnergyWh / systemEfficiency;
            
            let totalPanelPower = (sunHours > 0) ? (neededWh / sunHours) : 0;
            let numberOfPanels = (panelWatts > 0) ? Math.ceil(totalPanelPower / panelWatts) : 0;

            if (singleCapacity > 0 && battCount > 0 && panelWatts > 0 && sunHours > 0) {
                document.getElementById('panelsOutput').innerText = numberOfPanels;
                document.getElementById('detailsOutput').innerText = `${t.totalPowerPre} ${Math.round(totalPanelPower)} ${t.wattWord}`;
            } else {
                document.getElementById('panelsOutput').innerText = 0;
                document.getElementById('detailsOutput').innerText = `${t.totalPowerPre} 0 ${t.wattWord}`;
            }
        }

        function resetData() {
            document.getElementById('capacityInput').value = 0;
            document.getElementById('batteryCountInput').value = 0;
            document.getElementById('panelInput').value = 0;
            document.getElementById('sunHoursInput').value = 0;
            selectUnit('wh');
            selectVoltage('48');
            selectEfficiency('0.85', 'regionSanaa');
            calculate();
        }

        document.getElementById('capacityInput').addEventListener('input', calculate);
        document.getElementById('batteryCountInput').addEventListener('input', calculate);
        document.getElementById('panelInput').addEventListener('input', calculate);
        document.getElementById('sunHoursInput').addEventListener('input', calculate);

        applyLanguage();
    </script>
    
    <!-- كود تسجيل Service Worker لعمل التطبيق Offline -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('SW Registered successfully:', registration.scope);
                    })
                    .catch(error => {
                        console.log('SW Registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
